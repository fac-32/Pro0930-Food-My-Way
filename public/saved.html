<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food My Way: Saved Recipes</title>
    <meta
      name="description"
      content="Browse your saved recipes with ingredients, instructions, and nutrition details."
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/styles/style-nav.css" />
    <link rel="stylesheet" href="/styles/style-saved.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="/">
          <img
            src="images/High-Resolution-Color-Logo.png"
            alt="MySite Logo"
            class="full-logo"
            width="954"
            height="174"
            decoding="async"
          />
          <img
            src="images/favicon.png"
            alt="MySite Logo"
            class="small-logo"
            width="157"
            height="156"
            decoding="async"
          />
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/saved">Recipes</a></li>
      </ul>
    </nav>

    <main>
      <section id="saved-header" class="saved-header">
        <h1>Saved Recipes</h1>
        <p class="cta">
          Browse your saved recipes or
          <a href="/">search for and generate new ones</a>
        </p>
      </section>

      <section class="saved-layout">
        <div class="saved-left">
          <div id="saved-loading" class="loading-state" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <span>Loading recipes...</span>
          </div>
          <!-- Saved Recipes List -->
          <ul id="saved-recipes" class="meals-list"></ul>
        </div>

        <!-- Selected Recipe Panel -->
        <section
          id="recipe-container"
          class="recipe-display recipe-theme-primary is-empty"
        >
          <img
            id="selected-recipe-image"
            class="recipe-image"
            alt="Saved recipe image"
            width="640"
            height="480"
            decoding="async"
            style="display: none"
          />
        <div id="selected-recipe-title" class="recipe-title"></div>
        <div class="recipe-details">
          <div
            class="recipe-tabs"
            data-ingredients-id="selected-recipe-ingredients"
            data-nutrition-id="selected-recipe-nutrition"
          ></div>

          <div id="selected-recipe-instructions" class="recipe-instructions"></div>
        </div>
        <!-- DELETE button will be appended here by JS -->
      </section>
      </section>
    </main>

    <script type="module" src="./saved.js"></script>
  </body>
</html>
